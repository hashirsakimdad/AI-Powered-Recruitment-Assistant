name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-flask
      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          SEED_DEMO_USERS: "true"
        run: pytest tests/ -v
      - name: Check for debug=True in production code
        run: grep -r "debug=True" app.py && exit 1 || exit 0
