{% extends "base.html" %}
{% block title %}Sign In - AI Recruit{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card-clean">
    <div class="auth-head-clean">
      <h1 class="auth-title-clean">Welcome Back</h1>
      <p class="auth-subtitle-clean">Sign in to your account</p>
      <div class="auth-divider"></div>
    </div>

    <form method="POST" class="auth-form-clean" id="loginForm" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="loginEmail">Email Address</label>
        <div class="auth-input-wrap">
          <i class="bi bi-envelope auth-input-ico" aria-hidden="true"></i>
          <input
            id="loginEmail"
            name="email"
            type="email"
            class="auth-input"
            placeholder="your@email.com"
            required
            autofocus
            autocomplete="email"
          />
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="loginPassword">Password</label>
        <div class="auth-input-wrap">
          <i class="bi bi-lock auth-input-ico" aria-hidden="true"></i>
          <input
            id="loginPassword"
            name="password"
            type="password"
            class="auth-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button class="auth-submit" type="submit">
        Sign In
      </button>
    </form>

    <div class="auth-bottom">
      <div class="auth-bottom-text">
        Don't have an account?
        <a class="auth-link" href="{{ url_for('signup') }}">Sign up</a>
      </div>
      <div class="auth-builtby">⚡ Built by Hashir Sakimdad</div>
    </div>
  </div>
</div>
{% endblock %}
