{% if pagination and pagination.pages > 1 %}
<nav aria-label="Page navigation" class="mt-3">
  <ul class="pagination justify-content-center">
    <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
      {% if pagination.has_prev %}
      <a class="page-link" href="{{ pagination_url(pagination.prev_num) }}">Previous</a>
      {% else %}
      <span class="page-link" tabindex="-1" aria-disabled="true">Previous</span>
      {% endif %}
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ pagination.page }} of {{ pagination.pages }}</span></li>
    <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
      {% if pagination.has_next %}
      <a class="page-link" href="{{ pagination_url(pagination.next_num) }}">Next</a>
      {% else %}
      <span class="page-link" tabindex="-1" aria-disabled="true">Next</span>
      {% endif %}
    </li>
  </ul>
</nav>
{% endif %}
