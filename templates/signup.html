{% extends "base.html" %}
{% block title %}Sign Up - AI Recruit{% endblock %}
{% block content %}
<div class="auth-container">
  <!-- Animated Star Field Background -->
  <canvas id="starField" class="star-field-canvas"></canvas>
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card shadow-lg border-0">
          <div class="auth-header text-center mb-4">
            <div class="auth-icon bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
              <i class="bi bi-person-plus fs-2"></i>
            </div>
            <h2 class="fw-bold mb-2" style="font-size: 1.75rem;">Create Account</h2>
            <p class="text-muted small mb-0">Join AI Recruit to get started</p>
          </div>
          
          <form method="POST" class="auth-form" id="signupForm">
            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="bi bi-envelope me-1 text-primary"></i>Email Address
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-end-0">
                  <i class="bi bi-envelope text-muted"></i>
                </span>
                <input 
                  name="email" 
                  type="email" 
                  class="form-control border-start-0" 
                  placeholder="your@email.com" 
                  required 
                  autofocus 
                  autocomplete="email"
                />
              </div>
              <div class="invalid-feedback"></div>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="bi bi-lock me-1 text-primary"></i>Password
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-end-0">
                  <i class="bi bi-lock text-muted"></i>
                </span>
                <input 
                  name="password" 
                  type="password" 
                  class="form-control border-start-0" 
                  placeholder="Min. 6 characters" 
                  required 
                  autocomplete="new-password"
                  minlength="6"
                />
              </div>
              <small class="text-muted d-block mt-1">
                <i class="bi bi-info-circle me-1"></i>Must be at least 6 characters
              </small>
              <div class="invalid-feedback"></div>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="bi bi-lock-fill me-1 text-primary"></i>Confirm Password
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-end-0">
                  <i class="bi bi-lock-fill text-muted"></i>
                </span>
                <input 
                  name="confirm_password" 
                  type="password" 
                  class="form-control border-start-0" 
                  placeholder="Re-enter password" 
                  required 
                  autocomplete="new-password"
                />
              </div>
              <div class="invalid-feedback"></div>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-semibold mb-3">
                <i class="bi bi-person-badge me-1 text-primary"></i>I am a
              </label>
              <div class="btn-group w-100 shadow-sm" role="group">
                <input type="radio" class="btn-check" name="role" id="roleCandidate" value="candidate" checked />
                <label class="btn btn-outline-primary py-2" for="roleCandidate">
                  <i class="bi bi-person me-2"></i>Candidate
                </label>
                <input type="radio" class="btn-check" name="role" id="roleRecruiter" value="recruiter" />
                <label class="btn btn-outline-primary py-2" for="roleRecruiter">
                  <i class="bi bi-briefcase me-2"></i>Recruiter
                </label>
              </div>
            </div>
            
            <button class="btn btn-primary w-100 py-3 fw-semibold mb-3" type="submit" style="font-size: 1rem;">
              <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
          </form>
          
          <div class="auth-footer text-center mt-4">
            <p class="mb-3">
              <small class="text-muted">Already have an account?</small>
              <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold ms-1 text-primary">
                Sign in
              </a>
            </p>
            <div class="branding-credit mt-4 pt-3">
              <p class="mb-0">
                <small class="branding-text">
                  <i class="bi bi-stars me-1"></i>AI Powered by Zeeshan & Co.
                </small>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
