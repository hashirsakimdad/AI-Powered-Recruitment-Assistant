{% extends "base.html" %}
{% block title %}Sign Up - AI Recruit{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card-clean">
    <div class="auth-head-clean">
      <h1 class="auth-title-clean">Create Account</h1>
      <p class="auth-subtitle-clean">Join AI Recruit to get started</p>
      <div class="auth-divider"></div>
    </div>

    <form method="POST" class="auth-form-clean" id="signupForm" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="signupEmail">Email Address</label>
        <div class="auth-input-wrap">
          <i class="bi bi-envelope auth-input-ico" aria-hidden="true"></i>
          <input
            id="signupEmail"
            name="email"
            type="email"
            class="auth-input"
            placeholder="your@email.com"
            required
            autofocus
            autocomplete="email"
          />
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="signupPassword">Password</label>
        <div class="auth-input-wrap">
          <i class="bi bi-lock auth-input-ico" aria-hidden="true"></i>
          <input
            id="signupPassword"
            name="password"
            type="password"
            class="auth-input"
            placeholder="Create a password"
            required
            minlength="6"
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="signupConfirm">Confirm Password</label>
        <div class="auth-input-wrap">
          <i class="bi bi-shield-check auth-input-ico" aria-hidden="true"></i>
          <input
            id="signupConfirm"
            name="confirm_password"
            type="password"
            class="auth-input"
            placeholder="Re-enter password"
            required
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label">Role</label>
        <div class="auth-role">
          <label class="auth-role-option">
            <input type="radio" name="role" value="candidate" checked />
            <span>Candidate</span>
          </label>
          <label class="auth-role-option">
            <input type="radio" name="role" value="recruiter" />
            <span>Recruiter</span>
          </label>
        </div>
      </div>

      <button class="auth-submit" type="submit">
        Create Account
      </button>
    </form>

    <div class="auth-bottom">
      <div class="auth-bottom-text">
        Already have an account?
        <a class="auth-link" href="{{ url_for('login') }}">Sign in</a>
      </div>
      <div class="auth-builtby">⚡ Built by Hashir Sakimdad</div>
    </div>
  </div>
</div>
{% endblock %}
