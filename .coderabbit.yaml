# .coderabbit.yaml
language: "en-US"

reviews:
  auto_review:
    enabled: true
    drafts: false

  profile: "assertive"

  path_filters:
    - "!migrations/**"
    - "!instance/**"
    - "!static/vendor/**"
    - "!*.min.js"
    - "!*.min.css"

  instructions: |
    This is a Flask recruitment platform handling sensitive hiring data.

    ALWAYS check:

    1. SECURITY — Every POST route must have @login_required or @role_required.
       Every data query must filter by session user_id (user isolation).
       No hardcoded credentials anywhere. All inputs sanitized before DB.

    2. BUGS — Flag any route that renders a template without passing required
       template variables. Flag any url_for() call referencing a non-existent route.
       Flag any template link pointing to a route that does not exist.

    3. BROKEN LINKS — Check all sidebar nav links in templates match actual
       Flask blueprint route names (auth.*, recruiter.*, candidate.*, admin.*, api.*).

    4. EMPTY STATES — Flag any template that shows an empty list/table with no
       user guidance (no CTA, no explanation).

    5. CHARTS — Flag any Chart.js initialization that does not handle the case
       where all data values are 0.

    6. DARK MODE — Flag any UI theme state that is not persisted to localStorage.

    7. FORMS — Every form with method="POST" must have CSRF token when Flask-WTF
       is enabled. Flag missing tokens.

chat:
  auto_reply: true
